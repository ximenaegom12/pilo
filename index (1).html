<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#dff;overscroll-behavior:none}
#stage{position:absolute;left:50%;top:50%;overflow:hidden;background:#02030a;box-shadow:0 0 40px #0af4}
canvas{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4%;gap:2.2%}
.ov.on{display:flex}
h1{font-size:calc(var(--u)*7.5);letter-spacing:.12em;margin:0;color:#8cf;text-shadow:0 0 16px #0af}
h2{font-size:calc(var(--u)*6);margin:0;letter-spacing:.1em;text-shadow:0 0 14px currentColor}
p{margin:0;font-size:calc(var(--u)*3.6)}
button{font:700 calc(var(--u)*4) inherit;font-family:inherit;color:#bef;background:#06204acc;border:2px solid #4cf;border-radius:10px;padding:.7em 1.4em;letter-spacing:.1em;box-shadow:0 0 14px #0af8;cursor:pointer;transition:transform .1s,background .2s}
button:hover{background:#0a4a9acc}button:active{transform:scale(.94)}
.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{box-shadow:0 0 30px #4cf;transform:scale(1.06)}}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--u)*1.5);display:none;font-size:calc(var(--u)*3.2);pointer-events:none;background:linear-gradient(#001a;transparent);font-weight:700}
#hud .r{display:flex;justify-content:space-between;align-items:center;gap:4px}
.bar{height:calc(var(--u)*2);background:#0008;border:1px solid #4cf8;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#08f,#6df)}
#pg i{background:#fa3}#bossbar{display:none}#bossbar i{background:linear-gradient(90deg,#c00,#f55)}
#pause{position:absolute;right:calc(var(--u)*1.5);top:calc(var(--u)*13);display:none;width:calc(var(--u)*9);height:calc(var(--u)*9);padding:0;z-index:5}
#fs{position:absolute;right:calc(var(--u)*12);top:calc(var(--u)*13);display:none;width:calc(var(--u)*9);height:calc(var(--u)*9);padding:0;z-index:5}
#mv{position:absolute;left:0;top:18%;bottom:0;width:58%;display:none;z-index:3}
#fire{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*5);width:calc(var(--u)*22);height:calc(var(--u)*22);border-radius:50%;display:none;z-index:4;background:radial-gradient(#f66,#a00);border:3px solid #fcc;color:#fff;font-size:calc(var(--u)*4);align-items:center;justify-content:center;box-shadow:0 0 20px #f44a;font-weight:800;padding:0}
#fire.d{transform:scale(.9);filter:brightness(1.5)}
#joy{position:absolute;width:calc(var(--u)*20);height:calc(var(--u)*20);border-radius:50%;border:2px solid #4cf8;background:#08f2;display:none;z-index:3;pointer-events:none}
#joy b{position:absolute;width:40%;height:40%;border-radius:50%;background:#6df8;left:30%;top:30%}
#pop{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:calc(var(--u)*7);font-weight:800;color:#fd6;text-shadow:0 0 12px #f90;opacity:0;pointer-events:none;z-index:6}
#pop.s{animation:pp 1.3s}@keyframes pp{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
#alert{position:absolute;inset:0;box-shadow:inset 0 0 60px #f00;opacity:0;pointer-events:none;z-index:6}#alert.s{animation:al .5s}@keyframes al{0%{opacity:1}100%{opacity:0}}
#holo{position:absolute;left:3%;right:3%;top:20%;display:none;gap:3%;align-items:center;padding:2%;border:1px solid #4cf;border-radius:12px;background:linear-gradient(#08f3,#04a2);box-shadow:0 0 30px #0af8;z-index:7;pointer-events:none;overflow:hidden}
#holo.on{display:flex;animation:hin .35s}@keyframes hin{from{opacity:0;transform:scaleY(.1)}}
#holo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 3px,#4cf2 3px 4px);animation:sc 2s linear infinite}@keyframes sc{to{background-position:0 40px}}
#holo svg{width:calc(var(--u)*20);flex:none;filter:drop-shadow(0 0 6px #4cf) hue-rotate(0deg);animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-2deg)}}
.talk .mouth{animation:mt .18s infinite alternate}@keyframes mt{to{transform:scaleY(.2)}}
.mouth{transform-origin:50% 50%;transform-box:fill-box}
#holo div{font-size:calc(var(--u)*3.6);color:#cef;text-align:left;font-weight:600}
#holo small{color:#6df;display:block;font-size:calc(var(--u)*2.8);letter-spacing:.2em}
#cock{position:absolute;left:12%;right:12%;bottom:12%;height:34%;display:none;border:3px solid #345;border-radius:40% 40% 8px 8px;background:linear-gradient(#0af3,#012c);animation:fl 1s infinite alternate;overflow:hidden}
@keyframes fl{to{box-shadow:0 0 30px #fa05 inset}}
#cock svg{position:absolute;left:50%;transform:translateX(-50%);bottom:-5%;height:105%}
#skip{position:absolute;right:3%;bottom:3%;font-size:calc(var(--u)*3);padding:.4em .9em}
.sm{font-size:calc(var(--u)*3)!important;padding:.4em .9em}
table{border-collapse:collapse;font-size:calc(var(--u)*3.6)}td{padding:2px 10px;text-align:left}td:last-child{text-align:right;color:#fd6;font-weight:700}
</style></head><body>
<div id="stage">
<canvas id="cv"></canvas>
<div id="cock"></div>
<div id="hud"><div class="r"><span id="mname">ESCAPE FROM THE BATTLE</span><span>NV <b id="lv">1</b></span><span id="lives">♥♥♥</span></div>
<div class="r"><span>SCORE <b id="sc">0</b></span><span id="combo" style="color:#fd6"></span></div>
<div class="bar"><i id="sh"></i></div><div class="bar" id="pg"><i style="width:0"></i></div><div class="bar" id="bossbar"><i></i></div></div>

<div id="mv"></div><div id="joy"><b></b></div><button id="fire">FIRE</button>
<div id="pop"></div><div id="alert"></div>
<div id="holo"><svg id="holoface" viewBox="0 0 100 110"></svg><div><small id="hname">LEO · PILOTO</small><span id="htxt"></span></div></div>

<div class="ov on" id="menu"><h1>STAR WARS × LEO</h1><p style="color:#fd6;letter-spacing:.3em">ARCADE ESPACIAL</p>
<p id="best"></p><button class="pulse" id="bStart">▶ INICIAR</button>
<div><button class="sm" id="bMus">♪ MÚSICA: NO</button> <button class="sm" id="bSfx">🔊 EFECTOS: SÍ</button></div>
<p style="font-size:calc(var(--u)*2.8);opacity:.7">Izquierda: arrastra para mover · Derecha: FIRE<br>PC: WASD/flechas + espacio · P pausa</p></div>
<div class="ov" id="intro"><h2 id="sig" style="color:#f55;position:absolute;top:8%;animation:pl 1s infinite">GALACTIC DISTRESS SIGNAL</h2><button id="skip" class="sm">SALTAR ▸▸</button></div>
<div class="ov" id="leoScene"><div id="leoBig" style="width:55%"></div><p id="leoTxt" style="min-height:5em;color:#cef"></p><h2 id="wait" style="font-size:calc(var(--u)*4.5);opacity:0">PILOTO, TU NAVE TE ESPERA</h2><button id="bAccept" class="pulse" style="opacity:0;pointer-events:none">[ ACEPTAR MISIÓN ]</button></div>
<div class="ov" id="pauseM" style="background:#000a;z-index:8"><h2>PAUSA</h2><button id="bResume">CONTINUAR</button><button id="bRetryP" class="sm">REINICIAR</button><button id="bMenuP" class="sm">MENÚ</button><div><button class="sm" id="bMus2">♪</button> <button class="sm" id="bSfx2">🔊</button></div></div>
<div class="ov" id="over" style="background:#200c;z-index:8"><h2 style="color:#f44">MISSION FAILED</h2><p id="overS"></p><button id="bRetry">[ RETRY MISSION ]</button><button id="bMenu">[ MAIN MENU ]</button></div>
<div class="ov" id="win" style="background:#012d;z-index:8"><h2 style="color:#fd6">MISSION COMPLETE</h2><table id="stats"></table><h2 id="rank" style="color:#6df"></h2><button id="bAgain">[ JUGAR OTRA VEZ ]</button><button id="bHome">[ VOLVER AL INICIO ]</button></div>
</div>
<script>
"use strict";
const $=s=>document.getElementById(s),cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
const VW=400,VH=700,R=Math.random,PI2=Math.PI*2;
let SC=1,dpr=1;
function fit(){const W=innerWidth,H=innerHeight,s=Math.min(W/VW,H/VH);const w=VW*s,h=VH*s;stage.style.width=w+'px';stage.style.height=h+'px';stage.style.marginLeft=-w/2+'px';stage.style.marginTop=-h/2+'px';stage.style.setProperty('--u',w/100+'px');dpr=Math.min(devicePixelRatio||1,2);cv.width=w*dpr;cv.height=h*dpr;SC=w*dpr/VW}
addEventListener('resize',fit);fit();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---------- AUDIO ---------- */
const Snd={ac:null,mus:false,sfx:true,mt:null,
 init(){if(!this.ac){try{this.ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ac&&this.ac.state==='suspended')this.ac.resume()},
 tone(f,d,type='square',v=.08,sl=0,delay=0){if(!this.sfx||!this.ac)return;const a=this.ac,t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)},
 noise(d,v=.15){if(!this.sfx||!this.ac)return;const a=this.ac,n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(R()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(a.destination);s.start()},
 laser(){this.tone(900,.12,'square',.04,-600)},hit(){this.tone(200,.1,'sawtooth',.07,-100)},boom(){this.noise(.5,.2);this.tone(90,.4,'sawtooth',.1,-60)},
 pick(){this.tone(500,.1,'triangle',.1,500);this.tone(900,.15,'triangle',.1,300,.08)},alarm(){this.tone(440,.15,'square',.06);this.tone(330,.15,'square',.06,0,.18)},
 shield(){this.tone(300,.4,'sine',.12,600)},win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.3,'triangle',.1,0,i*.15))},lose(){[400,300,220,150].forEach((f,i)=>this.tone(f,.35,'sawtooth',.08,0,i*.2))},ui(){this.tone(700,.06,'triangle',.06)},
 startMusic(){this.stopMusic();if(!this.mus||!this.ac)return;const notes=[110,130.8,164.8,130.8,98,123.5,146.8,123.5];let i=0;const step=()=>{if(!this.mus){return}const a=this.ac,t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=notes[i%8]*(i%16<8?1:1.5);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.3);i++};this.mt=setInterval(step,300)},
 stopMusic(){clearInterval(this.mt);this.mt=null}};
function setMus(v){Snd.init();Snd.mus=v;v?Snd.startMusic():Snd.stopMusic();$('bMus').textContent='♪ MÚSICA: '+(v?'SÍ':'NO');$('bMus2').textContent='♪ '+(v?'ON':'OFF')}
function setSfx(v){Snd.sfx=v;$('bSfx').textContent='🔊 EFECTOS: '+(v?'SÍ':'NO');$('bSfx2').textContent='🔊 '+(v?'ON':'OFF')}
$('bMus').onclick=$('bMus2').onclick=()=>{setMus(!Snd.mus);Snd.ui()};$('bSfx').onclick=$('bSfx2').onclick=()=>{setSfx(!Snd.sfx);Snd.ui()};
/* ---------- PERSONAJES SVG ---------- */
function face(k){const a=k==='a';const skin=a?'#e2b08a':'#c98f6a',hair=a?'#5b3d22':'#15151c',suit=a?'#d96b10':'#2b5fd9',trim=a?'#fff':'#e8f0ff';
return `<g><path d="M10 110 Q15 75 50 72 Q85 75 90 110Z" fill="${suit}"/><path d="M38 74 L50 100 L62 74Z" fill="${trim}"/><rect x="42" y="62" width="16" height="14" fill="${skin}"/>
<ellipse cx="50" cy="42" rx="22" ry="26" fill="${skin}"/>
${a?`<path d="M27 38 Q28 12 50 12 Q72 12 73 38 Q66 24 50 24 Q34 24 27 38Z" fill="${hair}"/><path d="M36 27 L40 22 L44 27Z" fill="#fff"/><path d="M60 30 L64 56" stroke="#a33" stroke-width="1.6"/>`:`<path d="M26 44 Q22 10 50 9 Q78 10 74 44 Q70 26 58 24 Q44 30 36 24 Q28 28 26 44Z" fill="${hair}"/><path d="M28 24 Q50 4 72 24" stroke="#8cf" stroke-width="3" fill="none"/>`}
<g class="eyes"><ellipse cx="41" cy="44" rx="3.2" ry="3.6" fill="#fff"/><ellipse cx="59" cy="44" rx="3.2" ry="3.6" fill="#fff"/><circle cx="42" cy="45" r="2" fill="${a?'#3a6ea5':'#2a1a10'}"/><circle cx="60" cy="45" r="2" fill="${a?'#3a6ea5':'#2a1a10'}"/></g>
<path d="M36 38 Q41 ${a?35:36} 46 38M54 38 Q59 ${a?35:34} 64 38" stroke="${hair}" stroke-width="2" fill="none"/>
<ellipse class="mouth" cx="50" cy="${a?58:57}" rx="${a?5:6}" ry="${a?2.5:3.2}" fill="#7a2b2b"/>${a?'':'<path d="M44 55 Q50 62 57 54" stroke="#7a2b2b" stroke-width="1" fill="none"/>'}</g>`}
$('holoface').innerHTML=face('l');$('leoBig').innerHTML=`<svg viewBox="0 0 100 110" style="width:100%;filter:drop-shadow(0 0 10px #4cf);animation:bob 1.6s infinite" id="leoBigSvg">${face('l')}</svg>`;
$('cock').innerHTML=`<svg viewBox="0 0 100 110">${face('a')}</svg>`;
/* ---------- COMUNICACIONES ---------- */
let holoT=0;
function holo(txt,ms=3200,who='LEO · PILOTO'){const h=$('holo');$('htxt').textContent=txt;$('hname').textContent=who;h.classList.add('on','talk');Snd.tone(1200,.1,'sine',.05);clearTimeout(holoT);setTimeout(()=>h.classList.remove('talk'),Math.min(ms-300,2200));holoT=setTimeout(()=>{h.classList.remove('on');Snd.tone(800,.1,'sine',.05)},ms)}
function pop(t){const p=$('pop');p.textContent=t;p.classList.remove('s');void p.offsetWidth;p.classList.add('s')}
/* ---------- ESTADO ---------- */
let state='menu',G=null,T=0,last=0,raf=0,shake=0,tint=0;
const stars=[[],[],[]];for(let l=0;l<3;l++)for(let i=0;i<[60,40,25][l];i++)stars[l].push({x:R()*VW,y:R()*VH,s:[.6,1.2,2][l]});
const planets=[{x:290,y:150,r:60,c:'#3a6fd8',sp:2.5},{x:70,y:-300,r:35,c:'#c9702e',sp:3}];
let speedMul=1,introT=0,introTimers=[];
function bgUpdate(dt){const sp=[18,45,110];for(let l=0;l<3;l++)for(const s of stars[l]){s.y+=sp[l]*speedMul*dt;if(s.y>VH){s.y=-4;s.x=R()*VW}}
 for(const p of planets){p.y+=p.sp*speedMul*dt;if(p.y-p.r>VH){p.y=-p.r-20;p.x=R()*VW;p.r=25+R()*50;p.c=['#3a6fd8','#c9702e','#7a4fb0','#2e9c7c'][R()*4|0]}}}
function bgDraw(){const c=ctx;c.setTransform(SC,0,0,SC,0,0);c.fillStyle='#02030a';c.fillRect(0,0,VW,VH);
 const ng=c.createRadialGradient(80,200+Math.sin(T*.2)*30,10,80,200,260);ng.addColorStop(0,tint?'#d9a03a33':'#3a1a8a44');ng.addColorStop(1,'#0000');c.fillStyle=ng;c.fillRect(0,0,VW,VH);
 const ng2=c.createRadialGradient(330,480,10,330,480,240);ng2.addColorStop(0,tint?'#2a6fd844':'#0a4a8a44');ng2.addColorStop(1,'#0000');c.fillStyle=ng2;c.fillRect(0,0,VW,VH);
 for(const p of planets){const g=c.createRadialGradient(p.x-p.r*.4,p.y-p.r*.4,p.r*.1,p.x,p.y,p.r);g.addColorStop(0,p.c);g.addColorStop(1,'#000');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,p.r,0,PI2);c.fill()}
 for(let l=0;l<3;l++){c.fillStyle=['#678','#abc','#fff'][l];for(const s of stars[l]){const len=l===2?2+speedMul*3:s.s;c.fillRect(s.x,s.y,s.s,len)}}}
/* ---------- INTRO ---------- */
function clearIntro(){introTimers.forEach(clearTimeout);introTimers=[]}
function startIntro(){state='intro';ovs('intro');$('cock').style.display='block';$('hud').style.display='none';$('holo').classList.remove('on');speedMul=2;introT=0;tint=0;
 introTimers.push(setTimeout(()=>$('sig').style.opacity=1,100),setTimeout(()=>holo('Escuadrón Gris, estoy bajo fuego. ¡Necesito refuerzos!',3200,'ANAKIN SKYWALKER'),3500),setTimeout(endIntro,9000))}
function endIntro(){if(state!=='intro')return;clearIntro();$('cock').style.display='none';$('holo').classList.remove('on');startLeo()}
$('skip').onclick=()=>{Snd.ui();endIntro()};
function startLeo(){state='leo';speedMul=1;ovs('leoScene');const t=$('leoTxt'),msg='«Próximo piloto: Anakin. Necesitamos refuerzos… ¿nos ayudas?»';t.textContent='';$('wait').style.opacity=0;$('bAccept').style.opacity=0;$('bAccept').style.pointerEvents='none';const sv=$('leoBigSvg');sv.classList.add('talk');let i=0;
 const iv=setInterval(()=>{if(state!=='leo'){clearInterval(iv);return}t.textContent=msg.slice(0,++i);if(i%3==0)Snd.tone(1000+R()*300,.04,'sine',.03);if(i>=msg.length){clearInterval(iv);sv.classList.remove('talk');introTimers.push(setTimeout(()=>{$('wait').style.opacity=1;$('bAccept').style.opacity=1;$('bAccept').style.pointerEvents='auto'},400))}},45)}
$('bAccept').onclick=()=>{Snd.ui();Snd.shield();state='warp';ovs('');speedMul=1;let w=0;const warp=()=>{if(state!=='warp')return;speedMul=1+w*14;w+=.04;if(w<1.2)setTimeout(warp,30);else startGame()};warp()};
/* ---------- JUEGO ---------- */
function newGame(){return{ship:{x:200,y:600,vx:0,vy:0,r:11,inv:0,shield:100,lives:3,fire:0,rapid:0,dbl:0,pow:0,bub:0},bul:[],ebul:[],en:[],ast:[],pu:[],pt:[],txt:[],
 score:0,kills:0,shots:0,hits:0,dmg:0,time:0,combo:0,comboT:0,phase:1,pT:0,spawnE:0,spawnA:0,wave:0,boss:null,waveT:0,bossCalled:false,lowWarn:0,ending:0,dodged:0,phaseGoal:[1200,3200]}}
const keys={};let joy={x:0,y:0},firing=false;
function startGame(){cancelAnimationFrame(raf);G=newGame();state='play';ovs('');$('cock').style.display='none';tint=0;$('hud').style.display='block';$('pause').style.display=$('fs').style.display='block';$('mv').style.display='block';$('fire').style.display='flex';$('bossbar').style.display='none';$('mname').textContent='ESCAPE FROM THE BATTLE';$('lv').textContent=1;speedMul=1.2;if(Snd.mus)Snd.startMusic();last=performance.now();raf=requestAnimationFrame(loop);pop('PHASE 1');hudUpd()}
function hideCtl(){$('hud').style.display=$('pause').style.display=$('fs').style.display=$('mv').style.display=$('fire').style.display=$('joy').style.display='none'}
function ovs(id){document.querySelectorAll('.ov').forEach(o=>o.classList.toggle('on',o.id===id))}
function loop(now){if(state!=='play'&&state!=='ending'){return}raf=requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;update(dt);draw()}
function burst(x,y,n,cols,sp=120,life=.6){for(let i=0;i<n;i++){const a=R()*PI2,v=sp*(.3+R());G.pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*(.5+R()),m:life,c:cols[R()*cols.length|0],s:1+R()*2.5})}}
function addScore(n,x,y){const g=G;g.score+=n*Math.max(1,g.combo>=10?4:g.combo>=6?3:g.combo>=3?2:1)|0;g.txt.push({x,y,t:'+'+n,l:.8})}
function combo(){const g=G;g.combo++;g.comboT=2.5;const m=g.combo>=10?4:g.combo>=6?3:g.combo>=3?2:1;if([3,6,10].includes(g.combo))pop(g.combo===10?'ACE PILOT':'COMBO x'+m)}
function fireShip(){const s=G.ship,pw=s.pow>0?2:1;const mk=(dx,vx=0)=>G.bul.push({x:s.x+dx,y:s.y-16,vx,vy:-620,d:pw,r:3,pw:pw>1});if(s.dbl>0){mk(-8);mk(8)}else mk(0);if(s.dbl>0&&pw>1){mk(0,0)}G.shots+=s.dbl>0?2:1;Snd.laser()}
function hurt(d,x,y){const s=G.ship;if(s.inv>0||s.bub>0)return;s.inv=1.3;G.dmg+=d;s.shield-=d;shake=8;$('alert').classList.remove('s');void $('alert').offsetWidth;$('alert').classList.add('s');Snd.hit();burst(s.x,s.y,10,['#f55','#fa3'],100,.4);G.combo=0;

 else{c.setTransform(SC,0,0,SC,0,0);drawShip(c,200+Math.sin(T)*20,600,'#4cf',0,1)}
 if(state==='menu'||state==='leo'||state==='intro'||state==='warp'||state==='over'||state==='win'||state==='pause')kick()}
let idleId=0;function kick(){cancelAnimationFrame(idleId);idleId=requestAnimationFrame(idle)}
/* ---------- CONTROLES ---------- */
const mv=$('mv'),joyEl=$('joy');let mvId=null,mvO=null;
mv.addEventListener('pointerdown',e=>{if(mvId!==null||state!=='play')return;e.preventDefault();mvId=e.pointerId;mv.setPointerCapture(mvId);mvO={x:e.clientX,y:e.clientY};const r=stage.getBoundingClientRect(),u=r.width/100;joyEl.style.display='block';joyEl.style.left=(e.clientX-r.left-10*u)+'px';joyEl.style.top=(e.clientY-r.top-10*u)+'px'});
mv.addEventListener('pointermove',e=>{if(e.pointerId!==mvId)return;const r=stage.getBoundingClientRect(),R0=r.width*.12;let dx=e.clientX-mvO.x,dy=e.clientY-mvO.y;const m=Math.hypot(dx,dy);if(m>R0){dx=dx/m*R0;dy=dy/m*R0}joy.x=dx/R0;joy.y=dy/R0;const k=joyEl.firstChild;k.style.transform=`translate(${dx}px,${dy}px)`});
function mvEnd(e){if(e.pointerId!==mvId)return;mvId=null;joy.x=joy.y=0;joyEl.style.display='none';joyEl.firstChild.style.transform=''}
mv.addEventListener('pointerup',mvEnd);mv.addEventListener('pointercancel',mvEnd);mv.addEventListener('lostpointercapture',mvEnd);
const fb=$('fire');let fId=null;
fb.addEventListener('pointerdown',e=>{e.preventDefault();fId=e.pointerId;fb.setPointerCapture(fId);firing=true;fb.classList.add('d')});
function fEnd(e){if(e.pointerId!==fId)return;fId=null;firing=false;fb.classList.remove('d')}
['pointerup','pointercancel','lostpointercapture'].forEach(n=>fb.addEventListener(n,fEnd));
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if((k==='p'||k==='Escape')&&!e.repeat)togglePause()});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;firing=false;joy.x=joy.y=0;if(state==='play')togglePause(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause(true)});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault());
function togglePause(force){if(state==='play'){state='pause';cancelAnimationFrame(raf);firing=false;fb.classList.remove('d');ovs('pauseM');Snd.stopMusic();kick()}else if(state==='pause'&&!force){state='play';ovs('');if(Snd.mus)Snd.startMusic();last=performance.now();raf=requestAnimationFrame(loop)}}
$('pause').onclick=()=>{Snd.ui();togglePause()};$('bResume').onclick=()=>{Snd.ui();togglePause()};
$('fs').onclick=()=>{const d=document,el=d.documentElement;try{if(!d.fullscreenElement&&!d.webkitFullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el)}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d)}}catch(e){}};
function toMenu(){cancelAnimationFrame(raf);clearIntro();hideCtl();$('cock').style.display='none';$('holo').classList.remove('on');state='menu';tint=0;speedMul=1;Snd.stopMusic();bestTxt();ovs('menu');kick()}
function retry(){Snd.ui();cancelAnimationFrame(raf);startGame()}
$('bRetry').onclick=$('bRetryP').onclick=$('bAgain').onclick=retry;
$('bMenu').onclick=$('bMenuP').onclick=$('bHome').onclick=()=>{Snd.ui();toMenu()};
function bestTxt(){let b=0;try{b=+localStorage.getItem('swleo_best')||0}catch(e){}$('best').textContent=b?'MEJOR PUNTUACIÓN: '+b:''}
$('bStart').onclick=()=>{Snd.init();Snd.ui();startIntro()};
bestTxt();kick();
